<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proberaum-Kalender</title>
<style>
  :root{
    --bg: #16151a;
    --panel: #1e1c24;
    --panel-2: #26232e;
    --line: #34303c;
    --amber: #e8a33d;
    --amber-dim: #7a5a26;
    --text: #ece8e2;
    --text-dim: #9a94a3;
    --red: #d8654f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .top{
    padding:36px 20px 24px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(232,163,61,0.06), transparent 60%);
  }
  .eq{
    display:flex;
    justify-content:center;
    gap:4px;
    margin-bottom:14px;
  }
  .eq span{
    width:4px;
    background:var(--amber);
    border-radius:2px;
    opacity:0.85;
    animation: bounce 1.6s ease-in-out infinite;
  }
  .eq span:nth-child(1){height:10px; animation-delay:0s;}
  .eq span:nth-child(2){height:22px; animation-delay:0.15s;}
  .eq span:nth-child(3){height:14px; animation-delay:0.3s;}
  .eq span:nth-child(4){height:26px; animation-delay:0.45s;}
  .eq span:nth-child(5){height:12px; animation-delay:0.6s;}
  @keyframes bounce{
    0%,100%{transform:scaleY(0.5);}
    50%{transform:scaleY(1);}
  }
  h1{
    margin:0;
    font-size:1.7rem;
    letter-spacing:0.02em;
    font-weight:700;
  }
  h1 span{color:var(--amber);}
  .sub{
    color:var(--text-dim);
    font-size:0.9rem;
    margin-top:6px;
  }
  .container{
    max-width:760px;
    margin:0 auto;
    padding:24px 16px 0;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .month-nav button{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:1.1rem;
    width:38px;
    height:38px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.15s;
  }
  .month-nav button:hover{ background:var(--amber-dim); }
  .month-label{
    font-size:1.15rem;
    font-weight:600;
    text-transform:capitalize;
  }
  .weeks{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .week-row{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .week-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .week-head:hover{ background:var(--panel-2); }
  .week-kw{
    font-size:0.75rem;
    color:var(--amber);
    font-weight:700;
    letter-spacing:0.05em;
    margin-right:10px;
  }
  .week-range{
    font-weight:600;
  }
  .week-meta{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .week-count{
    font-size:0.8rem;
    color:var(--text-dim);
    background:var(--panel-2);
    padding:3px 9px;
    border-radius:20px;
  }
  .chevron{
    color:var(--text-dim);
    transition:transform 0.2s;
    font-size:0.9rem;
  }
  .week-row.open .chevron{ transform:rotate(90deg); color:var(--amber); }
  .week-body{
    display:none;
    border-top:1px solid var(--line);
    padding:14px 16px 18px;
    background:var(--bg);
  }
  .week-row.open .week-body{ display:block; }
  .day-card{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .day-card:last-child{ border-bottom:none; }
  .day-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
  }
  .day-name{
    font-weight:700;
    font-size:0.95rem;
  }
  .day-date{
    color:var(--text-dim);
    font-size:0.85rem;
  }
  .entries{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:8px;
  }
  .entry{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    padding:7px 10px;
    font-size:0.88rem;
  }
  .entry-info b{ color:var(--amber); }
  .entry-time{ color:var(--text-dim); margin-left:6px; }
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:1rem;
    line-height:1;
    padding:2px 6px;
  }
  .del-btn:hover{ color:var(--red); }
  .add-form{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .add-form input[type="text"]{
    flex:1 1 120px;
    min-width:100px;
  }
  .add-form input{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:7px 9px;
    font-size:0.85rem;
  }
  .add-form input[type="time"]{
    width:100px;
  }
  .add-form button{
    background:var(--amber);
    border:none;
    color:#1a1710;
    font-weight:700;
    border-radius:7px;
    padding:7px 14px;
    cursor:pointer;
    font-size:0.85rem;
    transition:filter 0.15s;
  }
  .add-form button:hover{ filter:brightness(1.1); }
  .empty-hint{
    color:var(--text-dim);
    font-size:0.82rem;
    font-style:italic;
  }
  .footer-note{
    text-align:center;
    color:var(--text-dim);
    font-size:0.75rem;
    margin-top:30px;
  }
  .loading{
    text-align:center;
    color:var(--text-dim);
    padding:20px;
    font-size:0.85rem;
  }
</style>
</head>
<body>

<div class="top">
  <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
  <h1>Proberaum<span>kalender</span></h1>
  <div class="sub">Wer probt wann? Einfach eintragen – kein Login nötig.</div>
</div>

<div class="container">
  <div class="month-nav">
    <button id="prevBtn">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextBtn">›</button>
  </div>
  <div class="weeks" id="weeksContainer">
    <div class="loading">Kalender wird geladen …</div>
  </div>
  <div class="footer-note">Alle Einträge sind für jeden mit diesem Link sichtbar und bearbeitbar.</div>
</div>

<script>
const dayNames = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

let viewYear, viewMonth; // viewMonth 0-indexed
const today = new Date();
viewYear = today.getFullYear();
viewMonth = today.getMonth();

let openWeekKey = null; // key of currently open week (Monday date string)

function pad(n){ return n.toString().padStart(2,"0"); }
function dateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDM(d){ return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; }
function fmtDMY(d){ return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`; }

function getMonday(d){
  const date = new Date(d);
  const day = date.getDay(); // 0=Sun
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return date;
}

function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

function getWeeksInMonth(year, month){
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month+1, 0);
  let cursor = getMonday(firstOfMonth);
  const weeks = [];
  while(cursor <= lastOfMonth){
    weeks.push(new Date(cursor));
    cursor.setDate(cursor.getDate()+7);
  }
  return weeks; // array of Monday-dates
}

async function loadBookings(ds){
  try{
    const res = await window.storage.get('booking:'+ds, true);
    if(res && res.value){
      return JSON.parse(res.value);
    }
    return [];
  }catch(e){
    return [];
  }
}

async function saveBookings(ds, list){
  try{
    await window.storage.set('booking:'+ds, JSON.stringify(list), true);
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
    alert('Speichern hat leider nicht geklappt. Bitte nochmal versuchen.');
  }
}

async function countWeekEntries(monday){
  let count = 0;
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(d.getDate()+i);
    const list = await loadBookings(dateStr(d));
    count += list.length;
  }
  return count;
}

function renderMonthLabel(){
  document.getElementById('monthLabel').textContent = `${monthNames[viewMonth]} ${viewYear}`;
}

async function renderWeeks(){
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '<div class="loading">Kalender wird geladen …</div>';
  const mondays = getWeeksInMonth(viewYear, viewMonth);
  const rows = [];

  for(const monday of mondays){
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate()+6);
    const key = dateStr(monday);
    const kw = isoWeekNumber(monday);
    const count = await countWeekEntries(monday);
    const isOpen = openWeekKey === key;

    rows.push(`
      <div class="week-row ${isOpen ? 'open' : ''}" data-key="${key}">
        <div class="week-head" data-toggle="${key}">
          <div>
            <span class="week-kw">KW ${kw}</span>
            <span class="week-range">${fmtDM(monday)} – ${fmtDMY(sunday)}</span>
          </div>
          <div class="week-meta">
            <span class="week-count">${count} Eintrag${count===1?'':'e'}</span>
            <span class="chevron">▸</span>
          </div>
        </div>
        <div class="week-body" id="body-${key}"></div>
      </div>
    `);
  }

  container.innerHTML = rows.join('');

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=> toggleWeek(el.getAttribute('data-toggle')));
  });

  if(openWeekKey){
    const monday = mondays.find(m => dateStr(m) === openWeekKey);
    if(monday) await renderWeekBody(monday);
  }
}

async function toggleWeek(key){
  if(openWeekKey === key){
    openWeekKey = null;
  } else {
    openWeekKey = key;
  }
  await renderWeeks();
}

async function renderWeekBody(monday){
  const body = document.getElementById('body-'+dateStr(monday));
  if(!body) return;
  body.innerHTML = '<div class="loading">Lade Tage …</div>';

  let html = '';
  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(d.getDate()+i);
    const ds = dateStr(d);
    const list = await loadBookings(ds);

    const entriesHtml = list.length
      ? list.map(e => `
          <div class="entry">
            <div class="entry-info"><b>${escapeHtml(e.name)}</b><span class="entry-time">${e.start}–${e.end} Uhr</span></div>
            <button class="del-btn" data-del="${ds}" data-id="${e.id}" title="Eintrag löschen">✕</button>
          </div>
        `).join('')
      : '<div class="empty-hint">Noch niemand eingetragen.</div>';

    html += `
      <div class="day-card">
        <div class="day-head">
          <span class="day-name">${dayNames[i]}</span>
          <span class="day-date">${fmtDMY(d)}</span>
        </div>
        <div class="entries" id="entries-${ds}">${entriesHtml}</div>
        <div class="add-form">
          <input type="text" placeholder="Name / Bandname" id="name-${ds}" maxlength="40">
          <input type="time" value="18:00" id="start-${ds}">
          <input type="time" value="21:00" id="end-${ds}">
          <button data-add="${ds}">Eintragen</button>
        </div>
      </div>
    `;
  }
  body.innerHTML = html;

  body.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', ()=> addEntry(btn.getAttribute('data-add')));
  });
  body.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(btn.getAttribute('data-del'), btn.getAttribute('data-id')));
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function addEntry(ds){
  const nameInput = document.getElementById('name-'+ds);
  const startInput = document.getElementById('start-'+ds);
  const endInput = document.getElementById('end-'+ds);
  const name = nameInput.value.trim();
  const start = startInput.value;
  const end = endInput.value;

  if(!name){
    nameInput.style.borderColor = 'var(--red)';
    nameInput.focus();
    return;
  }
  if(!start || !end){
    return;
  }

  const list = await loadBookings(ds);
  list.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, start, end });
  list.sort((a,b)=> a.start.localeCompare(b.start));
  await saveBookings(ds, list);

  nameInput.value = '';
  nameInput.style.borderColor = '';

  await renderWeeks();
}

async function deleteEntry(ds, id){
  const list = await loadBookings(ds);
  const filtered = list.filter(e => e.id !== id);
  await saveBookings(ds, filtered);
  await renderWeeks();
}

document.getElementById('prevBtn').addEventListener('click', async ()=>{
  viewMonth--;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  openWeekKey = null;
  renderMonthLabel();
  await renderWeeks();
});

document.getElementById('nextBtn').addEventListener('click', async ()=>{
  viewMonth++;
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  openWeekKey = null;
  renderMonthLabel();
  await renderWeeks();
});

renderMonthLabel();
renderWeeks();
</script>

</body>
</html>
